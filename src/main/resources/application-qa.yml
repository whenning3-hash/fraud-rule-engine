################################################################################
# Quality Assurance (QA) Environment Profile
#
# Activated by: SPRING_PROFILES_ACTIVE=qa
#
# Purpose: Final pre-production validation gate. All changes must pass QA
#          sign-off before promotion to production. QA runs the full regression
#          suite, penetration tests, and performance benchmarks.
#          In a Capitec deployment, the ArgoCD / GitOps pipeline overrides the
#          default endpoints below with the actual QA infrastructure URLs and
#          injects secrets from Vault.
#
# Running locally: This profile is NOT used for local development — use the
#          `local` profile with Docker Compose instead.
#
# Key differences from production:
#   - Swagger UI enabled: QA team performs exploratory and contract testing.
#   - WARN logging: reduces log noise during high-volume regression runs while
#     retaining warnings and errors for investigation.
#
# Security posture is identical to production: JWT enforced on all endpoints.
################################################################################

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/frauddb}
    username: ${DB_USERNAME:frauduser}
    password: ${DB_PASSWORD:fraudpass}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

fraud:
  score:
    threshold: 60
  security:
    jwt:
      secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLXNlY3JldC1rZXktZm9yLWZyYXVkLXJ1bGUtZW5naW5lLWFwcA==}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  api-docs:
    enabled: true  # QA team requires access to the API spec for contract and exploratory testing.
  swagger-ui:
    enabled: true

logging:
  level:
    root: WARN
    za.co.fraudruleengine: INFO  # Keep service-level INFO for QA test traceability.
