################################################################################
# Quality Assurance (QA) Environment Profile
#
# Activated by: SPRING_PROFILES_ACTIVE=qa
# Purpose: Final pre-production validation environment. All changes must pass
#          QA sign-off before being promoted to production. QA runs the full
#          regression suite, penetration tests, and performance benchmarks.
#
# Key differences from production:
#   - Swagger UI enabled — QA team performs exploratory and contract testing
#   - WARN logging — reduces log noise during high-volume regression runs while
#     still capturing warnings and errors for investigation
#
# Security posture identical to production: JWT enforced, Swagger read-only
# exposure is acceptable as QA runs in an isolated network segment.
#
# All secrets MUST be injected via the deployment pipeline.
################################################################################

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://fraud-rule-engine-db-qa:5432/frauddb}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:fraud-rule-engine-redis-qa}
      port: ${REDIS_PORT:6379}

fraud:
  score:
    threshold: 60
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  api-docs:
    enabled: true  # QA team requires access to the API spec for contract and exploratory testing.
  swagger-ui:
    enabled: true

logging:
  level:
    root: WARN
    za.co.fraudruleengine: INFO  # Keep service-level INFO for QA test traceability.
