spring:
  application:
    name: fraud-rule-engine

  datasource:
    # Connection details are always supplied via environment variables or Vault injection.
    # Localhost defaults allow the service to start with a local PostgreSQL instance (local profile + Docker Compose).
    # Non-local environments must set DB_URL, DB_USERNAME, DB_PASSWORD — no default is provided for prod.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/frauddb}
    username: ${DB_USERNAME:frauduser}
    password: ${DB_PASSWORD:fraudpass}
    driver-class-name: org.postgresql.Driver
    # HikariCP connection pool — tuned for concurrent fraud evaluation workloads.
    # Each transaction evaluation may hit the DB multiple times (rule queries + alert persistence),
    # so keeping a healthy pool prevents contention under load.
    hikari:
      pool-name: FraudRuleEnginePool
      maximum-pool-size: 20       # max concurrent DB connections; increase for high-traffic deployments
      minimum-idle: 5             # warm connections to avoid cold-start latency
      connection-timeout: 30000   # ms: how long to wait for a connection before throwing
      idle-timeout: 600000        # ms: how long idle connections are kept before being evicted
      max-lifetime: 1800000       # ms: max lifetime of a connection in the pool (must be < DB timeout)
      keepalive-time: 60000       # ms: heartbeat to prevent firewall/NAT from closing idle connections

  jpa:
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # MUST be set via REDIS_PASSWORD environment variable in every non-local deployment.
      # Defaults to empty (no password) for local development outside Docker Compose.
      # Docker Compose sets this automatically via SPRING_DATA_REDIS_PASSWORD.
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      # Lettuce connection pool — enables pooling for concurrent rule lookups (velocity, duplicate).
      # Requires commons-pool2 on the classpath (included in spring-boot-starter-data-redis BOM).
      lettuce:
        pool:
          enabled: true
          max-active: 16    # max concurrent Redis connections
          max-idle: 8       # max idle connections kept warm
          min-idle: 4       # min idle connections to maintain
          max-wait: 1000ms  # max time to wait for a connection before throwing

server:
  port: 8080
  error:
    # NEVER expose raw exception messages to callers — leaks schema, class names, SQL errors.
    # Override to 'always' only in the local profile for developer convenience.
    include-message: never
  # Tomcat thread pool — sized for a fraud evaluation service that does synchronous DB I/O.
  # Default is 200 max threads; made explicit here so DevOps can tune per environment.
  tomcat:
    threads:
      max: 200          # maximum number of concurrent request-handling threads
      min-spare: 10     # threads kept alive when idle (avoids spin-up latency for bursts)
    accept-count: 100   # queue depth when all threads are busy; requests beyond this are rejected
    connection-timeout: 20000  # ms: idle connection closed after this period

# Rate limiting — protects the fraud engine against DoS and prevents any single client
# from monopolising evaluation capacity.  Configuration consumed by RateLimitFilter.
rate-limit:
  transactions:
    enabled: true
    requests-per-minute: 120    # per client IP; roughly 2 transactions/second — generous for legit use
  global:
    enabled: true
    requests-per-minute: 1000   # total across all clients; prevents server-wide overload
  # SECURITY: Only enable when the service is behind a trusted L7 load balancer/reverse proxy
  # that strips and re-sets X-Forwarded-For from the real client address.
  # Leaving this false prevents IP spoofing to bypass per-client rate limits.
  trust-proxy-headers: false
  auth:
    enabled: true
    requests-per-minute: 10   # strict — prevents automated credential stuffing / password spray

fraud:
  score:
    threshold: 60
  # Data retention — POPIA Section 14 requires personal information to be kept no longer than
  # necessary for the purpose for which it was collected.  These values define the retention
  # periods enforced by scheduled cleanup jobs in the production deployment pipeline.
  # Transactions are personal financial data; fraud alerts are derived sensitive records.
  retention:
    transactions-days: 365      # retain raw transaction records for 1 year
    fraud-alerts-days: 2555     # retain fraud alerts for 7 years (regulatory / legal hold)
  security:
    enabled: true
    jwt:
      # MUST be overridden via JWT_SECRET environment variable in every non-local deployment.
      # Storing a real signing secret in source control is a critical security vulnerability.
      # Example (Kubernetes): env: - name: JWT_SECRET valueFrom: secretKeyRef: ...
      secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLXNlY3JldC1rZXktZm9yLWZyYXVkLXJ1bGUtZW5naW5lLWFwcA==}
      expiration-ms: 86400000

springdoc:
  api-docs:
    path: /api-docs
    # API documentation must not be publicly accessible in production.
    # Enabled only via application-local.yml override.
    enabled: false
  swagger-ui:
    path: /swagger-ui
    enabled: false

management:
  endpoints:
    web:
      exposure:
        # Only expose the health probe — /actuator/info leaks build metadata and git SHAs.
        include: health
  endpoint:
    health:
      show-details: when-authorized

logging:
  config: classpath:log4j2.xml
