################################################################################
# Development (DEV) Environment Profile
#
# Activated by: SPRING_PROFILES_ACTIVE=dev
#
# Purpose: Shared DEV environment for day-to-day developer and integration-team
#          testing. In a Capitec deployment this profile is activated by the
#          ArgoCD / GitOps pipeline, which overrides the default endpoints below
#          with the actual DEV infrastructure URLs and injects secrets from Vault.
#
# Running locally: This profile is NOT used for local development — use the
#          `local` profile with Docker Compose instead.
#
# Key differences from production:
#   - fraud.score.threshold = 50: individual rules trigger alerts, making rule
#     behaviour easy to observe and verify during development test runs.
#   - Swagger UI enabled: developers and integration teams need API documentation.
#   - Full error messages in responses: aids debugging without log access.
#   - Relaxed rate limits: automated test suites submit request batches freely.
#   - DEBUG logging for service code: full tracing of rule evaluation decisions.
################################################################################

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/frauddb}
    username: ${DB_USERNAME:frauduser}
    password: ${DB_PASSWORD:fraudpass}
  jpa:
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

fraud:
  score:
    threshold: 50  # Lower than production — individual rules trigger alerts; useful for verifying rule behaviour.
  security:
    jwt:
      secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLXNlY3JldC1rZXktZm9yLWZyYXVkLXJ1bGUtZW5naW5lLWFwcA==}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  api-docs:
    enabled: true  # Swagger accessible in DEV for developers and integration teams.
  swagger-ui:
    enabled: true

rate-limit:
  transactions:
    requests-per-minute: 200  # Relaxed — developers run automated test batches.
  auth:
    requests-per-minute: 30   # Relaxed — allows test scripts to obtain tokens freely.

server:
  error:
    include-message: always  # Expose full error detail in DEV to aid debugging without log access.

logging:
  level:
    root: INFO
    za.co.fraudruleengine: DEBUG  # Full rule evaluation trace in DEV.
