################################################################################
# Integration (INT) Environment Profile
#
# Activated by: SPRING_PROFILES_ACTIVE=int
#
# Purpose: Stable integration environment for QA automation and cross-team
#          integration testing. In a Capitec deployment, the ArgoCD / GitOps
#          pipeline overrides the default endpoints below with the actual INT
#          infrastructure URLs and injects secrets from Vault.
#
# Running locally: This profile is NOT used for local development — use the
#          `local` profile with Docker Compose instead.
#
# Key differences from production:
#   - Swagger UI enabled: QA automation teams and integration partners need API docs.
#   - INFO logging: enough detail to diagnose failing integration test scenarios.
################################################################################

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/frauddb}
    username: ${DB_USERNAME:frauduser}
    password: ${DB_PASSWORD:fraudpass}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

fraud:
  score:
    threshold: 60
  security:
    jwt:
      secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLXNlY3JldC1rZXktZm9yLWZyYXVkLXJ1bGUtZW5naW5lLWFwcA==}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  api-docs:
    enabled: true  # Swagger accessible in INT — required by integration and QA teams.
  swagger-ui:
    enabled: true

logging:
  level:
    root: INFO
    za.co.fraudruleengine: INFO
