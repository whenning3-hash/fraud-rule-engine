################################################################################
# Production (PROD) Environment Profile
#
# Activated by: SPRING_PROFILES_ACTIVE=prod
# Purpose: Live production environment serving real customer transactions.
#
# SECURITY HARDENING — the following restrictions are explicitly enforced here
# and must NEVER be relaxed in this file:
#   - fraud.security.enabled=true  (JWT authentication enforced on all endpoints)
#   - springdoc.enabled=false       (API documentation must not be publicly accessible)
#   - server.error.include-message=never (no exception detail exposed to callers)
#   - rate-limit.trust-proxy-headers=true (service is behind an L7 load balancer)
#
# SECRETS — all secrets are injected by the deployment pipeline (Vault / Kubernetes
# Secret / ArgoCD sealed-secrets). No defaults are provided for credentials — the
# service will FAIL FAST on startup if any required secret is absent. This is
# intentional: a service without proper credentials must not serve traffic.
#
# Required environment variables (no defaults):
#   DB_URL              — JDBC URL for the production PostgreSQL instance
#   DB_USERNAME         — Database user
#   DB_PASSWORD         — Database password
#   REDIS_HOST          — Redis endpoint (ElastiCache / Redis Enterprise)
#   REDIS_PASSWORD      — Redis authentication password
#   JWT_SECRET          — HMAC signing key for JWT tokens (≥256-bit entropy)
################################################################################

spring:
  datasource:
    # No default — service must not start without a real database URL.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Increase pool size in production to handle peak fraud evaluation load.
      maximum-pool-size: 50
      minimum-idle: 10
  jpa:
    show-sql: false  # Never log SQL in production — performance impact and data leakage risk.
  data:
    redis:
      # No default — service must not start without a real Redis endpoint.
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      # Redis SSL is mandatory in production to protect velocity and deduplication data in transit.
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
      lettuce:
        ssl:
          enabled: ${REDIS_SSL_ENABLED:true}
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

fraud:
  score:
    threshold: 60  # Production threshold: requires combined signals, not a single rule match.
  security:
    enabled: true  # Explicitly set — never rely on the base default for a security-critical property.
    jwt:
      # No default — JWT_SECRET must be injected. A missing secret causes immediate startup failure.
      secret: ${JWT_SECRET}
      # 8-hour session lifetime in production — reduce risk window if a token is compromised.
      expiration-ms: ${JWT_EXPIRATION_MS:28800000}

rate-limit:
  # In production the service sits behind an L7 load balancer (NGINX / AWS ALB) that reliably
  # strips and re-sets X-Forwarded-For from the real client address. Trusting proxy headers is
  # safe ONLY in this configuration — enabling it without a trusted proxy allows IP spoofing.
  trust-proxy-headers: true
  transactions:
    requests-per-minute: 60  # Tighter in production — legitimate clients should not need more.
  auth:
    requests-per-minute: 5   # Strict in production — limits credential-stuffing to 5 guesses/min.

server:
  error:
    include-message: never  # Explicitly set — never expose exception detail to API callers in production.

springdoc:
  api-docs:
    enabled: false   # API documentation must not be publicly accessible in production.
  swagger-ui:
    enabled: false   # Swagger UI must not be publicly accessible in production.

logging:
  level:
    root: WARN                       # Suppress INFO noise in production — only warnings and errors.
    za.co.fraudruleengine: INFO      # Keep service-level INFO for fraud alert observability and ops.
    za.co.fraudruleengine.filter: WARN  # Suppress per-request rate-limit logs unless something is wrong.
