################################################################################
# Local Environment Profile
#
# Activated by: SPRING_PROFILES_ACTIVE=local  (set in docker-compose.yml)
#
# This is the sole active environment profile. It runs with the full production
# security posture — nothing is bypassed. All controls that would be enforced
# in a live deployment are active here:
#
#   - JWT authentication is ENFORCED on all protected endpoints
#   - Unauthenticated requests return 401 Unauthorized
#   - Rate limiting is active on transaction and auth endpoints
#   - Exception detail is never returned in API responses
#   - SQL statements are not logged to stdout
#
# Swagger UI is enabled so that the API can be explored interactively at
# http://localhost:8080/swagger-ui/index.html. Swagger routes are protected
# behind the standard JWT requirement — a valid Bearer token must be presented.
# In a deployment where an internal docs portal is available, this flag would
# be left at the base default (false).
#
# Obtaining a token:
#   POST /api/v1/auth/token
#   Body:  {"username":"admin","password":"admin123"}
#   Use the returned "accessToken" as:
#   Authorization: Bearer <token>   on every subsequent request.
#
# Integration tests override fraud.security.enabled=false via @TestPropertySource
# so that they can assert business logic without acquiring tokens at runtime.
################################################################################

fraud:
  security:
    # JWT authentication enforced. Integration tests override this to false via
    # @TestPropertySource so they run independently of the auth flow.
    enabled: true
  score:
    # Threshold set to 20 so that individual rules trigger fraud alerts.
    # This allows each rule's behaviour to be verified in isolation without
    # needing multiple signals to accumulate above the production default of 60.
    threshold: 20

spring:
  jpa:
    show-sql: false  # SQL not logged to stdout — production behaviour.

server:
  error:
    # Exception detail is never exposed in API responses — production behaviour.
    # Use Docker logs for diagnostics: docker logs fraud-rule-engine
    include-message: never

rate-limit:
  auth:
    # Auth endpoint rate limit active. 30 rpm allows normal API use while protecting
    # against automated credential-stuffing attacks.
    enabled: true
    requests-per-minute: 30

springdoc:
  api-docs:
    # Swagger UI enabled for interactive API exploration at /swagger-ui/index.html.
    # A valid Bearer token is required to access the documentation.
    enabled: true
  swagger-ui:
    enabled: true

logging:
  config: classpath:log4j2-local.xml
